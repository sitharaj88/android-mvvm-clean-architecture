name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · Test · Detekt · Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Detekt (static analysis)
        run: ./gradlew detekt --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew testDevDebugUnitTest --no-daemon --stacktrace

      - name: Coverage verification
        run: ./gradlew :feature:notes:jacocoCoverageVerification --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDevDebug --no-daemon --stacktrace

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/**
            **/build/reports/detekt/**
            **/build/reports/jacoco/**
          retention-days: 7
